{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Student Notes Sharing</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">NotesShare</a>

        <div>
            {% if user.is_authenticated %}
                <a class="btn btn-outline-light btn-sm" href="{% url 'upload' %}">Upload</a>
                <a class="btn btn-outline-light btn-sm" href="{% url 'notes_list' %}">Notes</a>
                <button onclick="toggleTheme()" class="btn btn-outline-light btn-sm me-2">
                  🌙
                </button>

                <a class="btn btn-danger btn-sm" href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a class="btn btn-success btn-sm" href="{% url 'login' %}">Login</a>
                <a class="btn btn-primary btn-sm" href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>
<script src="{% static 'js/main.js' %}"></script>
</body>
</html>
